[project]
name = "batch2go-modelgen"
version = "0.1.0"
description = "Deterministic generation of batch2go synthetic ONNX models (repeated-block compute, declared padding input, self-attesting uid membership)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch2go_modelgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
